# Example HTTPS virtual host. Replace the domain, certificate paths, and PHP-FPM socket.
server {
    listen 80;
    server_name clinic.example.com;
    return 308 https://clinic.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clinic.example.com;
    root /var/www/tooth-lounge;
    index index.php;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/clinic.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clinic.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ~* ^/(?:\.git|config|database|docs|scripts|tests|EXPO-GO-appdev)(?:/|$) { deny all; }
    location ~* ^/(?!\.well-known/)(?:\.) { deny all; }
    location ~* \.(?:sql|sql\.gz|age|log|ini|cnf|bak)$ { deny all; }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
    }
}
